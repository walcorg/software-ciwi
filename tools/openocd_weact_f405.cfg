# =============================================================================
# openocd_weact_f405.cfg
# Configuración de OpenOCD para WeAct STM32F405RGT6 Mini Core Board
# -----------------------------------------------------------------------------
# Uso:
#   openocd -f tools/openocd_weact_f405.cfg
#
# Para flashear en un solo comando:
#   openocd -f tools/openocd_weact_f405.cfg \
#           -c "program build/phase1/ciwi-phase1.elf verify reset exit"
#
# Conexión física ST-Link V2 → WeAct Board:
#   ST-Link  |  WeAct Board
#   ---------|-------------
#   SWDIO    |  DIO   (marcado en la placa)
#   SWDCLK   |  CLK   (marcado en la placa)
#   GND      |  GND   (marcado en la placa)
#   3.3V     |  3V3   (marcado en la placa) ← opcional si la placa
#                                              tiene alimentación propia
# =============================================================================


# -----------------------------------------------------------------------------
# 1. INTERFAZ DE PROGRAMACIÓN — ST-Link V2
# -----------------------------------------------------------------------------
# Le dice a OpenOCD qué programador USB estamos usando.
# "hla" = High-Level Adapter (protocolo de ST-Link, CMSIS-DAP, etc.)
# "hla_layout stlink" especifica que es un ST-Link en particular.
# [v0.2] Forma moderna (OpenOCD >= 0.11): usar el archivo de interfaz incluido.
#        Sustituye a "interface hla" / "hla_layout stlink", que están obsoletos.
source [find interface/stlink.cfg]
transport select hla_swd


# -----------------------------------------------------------------------------
# 2. TARGET — STM32F405RGT6
# -----------------------------------------------------------------------------
# Carga el archivo de configuración del chip STM32F4x de OpenOCD.
# Este archivo define la memoria flash, RAM, y comandos específicos
# del STM32F4. Está incluido en la instalación de OpenOCD en:
#   Linux:   /usr/share/openocd/scripts/target/stm32f4x.cfg
#   macOS:   /usr/local/share/openocd/scripts/target/stm32f4x.cfg
#   Windows: C:\OpenOCD\share\openocd\scripts\target\stm32f4x.cfg
source [find target/stm32f4x.cfg]


# -----------------------------------------------------------------------------
# 3. VELOCIDAD DEL CLOCK DE DEBUG
# -----------------------------------------------------------------------------
# Velocidad del bus SWD en kHz.
# 4000 kHz (4 MHz) funciona bien con cables cortos (<20cm).
# Si tienes errores de conexión, baja a 1000 o 500.
adapter speed 4000


# -----------------------------------------------------------------------------
# 4. RESET CONFIGURATION
# -----------------------------------------------------------------------------
# Define cómo OpenOCD resetea el chip.
# "srst_nogate" = usa el pin NRST del chip para el reset de sistema.
# La WeAct tiene el pin NR (NRST) accesible — OpenOCD lo usa si está
# conectado al ST-Link pin NRST, pero también funciona sin él via
# el reset por software del Cortex-M4.
reset_config srst_nogate


# -----------------------------------------------------------------------------
# 5. EVENTOS AL INICIAR LA SESIÓN
# -----------------------------------------------------------------------------
# Estos comandos se ejecutan automáticamente cuando OpenOCD se conecta.
$_TARGETNAME configure -event gdb-attach {
    # Al conectar GDB: hacer un halt para poder inspeccionar el estado
    echo "GDB conectado — haciendo halt del CPU"
    halt
}

$_TARGETNAME configure -event reset-init {
    # Después de reset: configurar el clock del debug a velocidad máxima
    # Esto acelera la escritura de flash significativamente
    adapter speed 4000
}


# -----------------------------------------------------------------------------
# 6. CONFIGURACIÓN DE FLASH
# -----------------------------------------------------------------------------
# Le dice a OpenOCD el tamaño y organización de la flash del STM32F405.
#
# STM32F405RGT6 tiene 1MB de flash organizada en sectores:
#   Sector 0: 16KB  → Bootloader (0x08000000)
#   Sector 1: 16KB  → Bootloader
#   Sector 2: 16KB  → Bootloader
#   Sector 3: 16KB  → Bootloader
#   Sector 4: 64KB  → Firmware inicio
#   Sector 5: 128KB → Firmware
#   Sector 6: 128KB → Firmware
#   Sector 7: 128KB → Firmware
#   Sector 8: 128KB → Firmware (hasta aquí llega el firmware de Trezor)
#   Sector 9: 128KB → Almacenamiento de claves
#   Sector 10: 128KB → Almacenamiento de claves
#   Sector 11: 128KB → Almacenamiento de claves
#
# El stm32f4x.cfg ya configura esto automáticamente, pero lo
# documentamos aquí para referencia del layout de memoria.
#
# Base address de flash: 0x08000000
# Tamaño total:          1MB (0x100000)
# Base address de RAM:   0x20000000
# Tamaño de RAM:         128KB (0x20000) — SRAM1
# RAM adicional:         64KB  (0x10000) — CCM (Core Coupled Memory)


# -----------------------------------------------------------------------------
# 7. SERVIDOR GDB Y TELNET
# -----------------------------------------------------------------------------
# Puerto donde GDB se conecta para debug interactivo.
# Uso: arm-none-eabi-gdb build/phase1/ciwi-phase1.elf
#      (gdb) target remote :3333
# gdb_port 3333   ← ya definido en stm32f4x.cfg, no repetir

# Puerto telnet para control manual de OpenOCD.
# Uso: telnet localhost 4444
# Comandos útiles en telnet:
#   halt          → detener el CPU
#   reset         → resetear el chip
#   flash write_image erase build/phase1/ciwi-phase1.elf → flashear
#   mdw 0x08000000 → leer 32 bits de la dirección 0x08000000
# telnet_port 4444  ← ya definido en stm32f4x.cfg


# -----------------------------------------------------------------------------
# 8. MENSAJE DE CONFIRMACIÓN
# -----------------------------------------------------------------------------
# Se muestra en la terminal cuando OpenOCD carga esta configuración.
echo "------------------------------------------------------------"
echo "CiWi (WALCORG) — OpenOCD config cargada"
echo "Target : STM32F405RGT6 (WeAct Mini Core)"
echo "Adapter: ST-Link V2 via SWD"
echo "Flash  : 1MB @ 0x08000000"
echo "RAM    : 128KB @ 0x20000000"
echo "------------------------------------------------------------"
echo "Comandos útiles:"
echo "  Flashear : openocd -f tools/openocd_weact_f405.cfg -c 'program build/phase1/ciwi-phase1.elf verify reset exit'"
echo "  Debug GDB: arm-none-eabi-gdb build/phase1/ciwi-phase1.elf (luego: target remote :3333)"
echo "------------------------------------------------------------"
